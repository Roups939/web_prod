<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Currency Tracker{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-color: #0a0a0a;
            --text-main: #e0e0e0;
            --text-muted: #888888;
            --accent-green: #00ff66;
            --border-green: #003311;
            --nav-bg: #111111;
            --card-bg: #151515;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--nav-bg);
            border-bottom: 2px solid var(--border-green);
            padding: 0 20px;
        }

        nav {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between; /* Разносим лого и кнопки */
            height: 60px;
        }

        .logo {
            color: #fff;
            text-decoration: none;
            font-size: 20px;
            font-weight: 600;
        }
        .logo span { color: var(--accent-green); }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            margin-left: 20px;
            transition: color 0.2s ease;
        }
        .nav-links a:hover { color: var(--accent-green); }

        main {
            flex: 1;
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
            width: 100%;
        }

        h1 {
            color: #ffffff;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
        }
        h1::before {
            content: "";
            display: inline-block;
            width: 4px;
            height: 24px;
            background-color: var(--accent-green);
            margin-right: 12px;
            border-radius: 2px;
        }

        /* --- Стили для карточек (адаптация под наш проект) --- */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-green);
            border-radius: 6px;
            padding: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 255, 102, 0.1);
            border-color: var(--accent-green);
        }

        .card-title {
            font-size: 14px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .card-value {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
        }
        
        .text-green { color: var(--accent-green); }
        .text-red { color: #ff4444; }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 13px;
            border-top: 1px solid var(--border-green);
            margin-top: auto;
        }

        input[type="text"],
        input[type="password"],
        input[type="number"],
        input[type="email"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-color) !important; /* Темный фон */
            border: 1px solid var(--border-green) !important;
            border-radius: 4px;
            color: #ffffff !important; /* Белый текст */
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            font-size: 15px;
            transition: all 0.2s ease;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--accent-green) !important;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.2);
        }

        /* Стили для текста подсказок под полями */
        .helptext, small {
            color: var(--text-muted);
            font-size: 13px;
            display: block;
            margin-top: 5px;
        }

        /* Стили для ошибок валидации */
        .errorlist {
            color: #ff4444;
            list-style: none;
            padding: 0;
            margin-top: 5px;
            font-size: 13px;
        }

        button.btn-next {
        background-color: transparent;
        color: var(--accent-green);
        border: 2px solid var(--accent-green);
        padding: 12px 24px;
        font-size: 16px;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1px;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.3s ease;
        width: 100%; /* Чтобы кнопка была на всю ширину формы */
        display: block;
    }

    button.btn-next:hover {
        background-color: var(--accent-green);
        color: #000; /* Черный текст при наведении */
        box-shadow: 0 0 15px rgba(0, 255, 102, 0.4);
    }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="{% url 'home' %}" class="logo">> Currency<span>_</span>Tracker</a>
            <div class="nav-links">
                {% if user.is_authenticated %}
                    <a href="{% url 'dashboard' %}">Мой портфель</a>
                    <a href="/admin/">Админка</a>
                    <span style="color: var(--accent-green);">[{{ user.username }}]</span>
                {% else %}
                    <a href="{% url 'login' %}">Войти</a>
                    <a href="{% url 'register' %}">Регистрация</a>
                {% endif %}
            </div>
        </nav>
    </header>
    
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        Currency Tracker &copy; 2026 | Security first.
    </footer>
</body>
</html>
