{% extends 'main/base.html' %}
{% block content %}
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>


<div style="max-width: 500px; margin: 50px auto;">
    <h1 style="margin-bottom: 20px;">Создать счет</h1>

    <div class="card" style="padding: 30px;">
        <form method="post">
            {% csrf_token %}
            
            {% for field in form %}
                <div style="margin-bottom: 20px;">
                    <label style="display: block; color: var(--accent-green); margin-bottom: 5px; font-weight: 600;">
                        {{ field.label }}
                    </label>
                    {{ field }}
                    {% if field.help_text %}
                        <div class="helptext">{{ field.help_text }}</div>
                    {% endif %}
                    {% if field.errors %}
                        <div class="errorlist">{{ field.errors }}</div>
                    {% endif %}
                </div>
            {% endfor %}

            <div style="display: flex; gap: 15px; margin-top: 30px;">
                <button type="submit" class="btn-next" style="flex: 1;">Создать</button>
                <a href="{% url 'dashboard' %}" style="flex: 1; text-align: center; padding: 12px; color: var(--text-muted); border: 1px solid var(--text-muted); border-radius: 4px; text-decoration: none; display: flex; align-items: center; justify-content: center;">Отмена</a>
            </div>
        </form>
    </div>
</div>

<script>
    $(document).ready(function() {
        $('#id_currency').select2({
            width: '100%',
            placeholder: 'Начните вводить название валюты...',
            language: {
                noResults: function() { return "Валюта не найдена"; },
                searching: function() { return "Поиск..."; }
            }
        });
    });
</script>
{% endblock %}
